server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://cyna-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend-file-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-logs
          app: cyna-backend
          __path__: /host/logs/cyna/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            traceId: traceId
            message: message
            method: method
            status: status
            duration_ms: duration_ms
            uri: uri
      - labels:
          level:
          logger:
          traceId:
          method:
          status:

  - job_name: frontend-file-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend-logs
          app: cyna-frontend
          __path__: /host/logs/cyna/cyna-frontend*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            traceId: traceId
            message: message
            url: url
      - labels:
          level:
          logger:
          traceId:
          url:

  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'app'
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            logger: logger_name
            traceId: traceId
      - labels:
          level:
          logger:
          traceId:
