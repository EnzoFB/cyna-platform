email:
  welcome:
    subject: "Bienvenue sur CYNA !"
    title: "Bonjour {0},"
    intro: "Nous sommes ravis que vous ayez rejoint CYNA !"
    desc: "Protégez votre entreprise avec des solutions SaaS de cybersécurité avancées : SOC, EDR, XDR."
    cta: "Accédez dès maintenant à votre plateforme."
    signature: "À très bientôt,<br>L'équipe CYNA"
  verification:
    subject: "Confirmez votre adresse e-mail CYNA"
    title: "Bonjour {0},"
    intro: "Merci de vous être inscrit sur CYNA ! Il ne reste qu'une étape pour activer votre compte."
    desc: "Cliquez sur le bouton ci-dessous pour confirmer votre adresse e-mail. Ce lien est à usage unique et expire dans 24 heures."
    cta: "Confirmer mon adresse e-mail"
    security: "Si vous n'êtes pas à l'origine de cette inscription, vous pouvez ignorer cet e-mail — aucun compte ne sera activé."
    signature: "À très bientôt,<br>L'équipe CYNA"
  otp:
    subject: "Votre code de connexion CYNA"
    title: "Votre code de vérification"
    intro: "Utilisez le code ci-dessous pour finaliser votre connexion à la plateforme CYNA."
    expiry: "Ce code expire à {0}. Ne le partagez avec personne."
    security: "Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail et sécurisez votre compte immédiatement."
    signature: "À très bientôt,<br>L'équipe CYNA"
  subscriptionAutoRenewReminder:
    subject: "Renouvellement automatique de votre abonnement CYNA"
    title: "Bonjour {0},"
    intro: "Nous vous informons que votre abonnement sera renouvelé automatiquement dans 2 mois."
    desc: "Si vous ne souhaitez pas ce renouvellement automatique, vous pouvez désactiver cette option depuis votre espace client."
    cta: "Gérer mon abonnement"
    signature: "À bientôt,<br>L'équipe CYNA"
  subscriptionTrialWillEnd:
    subject: "Votre essai gratuit CYNA se termine bientôt"
    title: "Bonjour {0},"
    intro: "Votre période d'essai gratuit touche à sa fin pour l'abonnement suivant :"
    desc: "À la fin de l'essai, votre abonnement sera automatiquement activé et votre moyen de paiement débité (la totalité de l'année pour un abonnement annuel). Si vous ne souhaitez pas continuer, vous pouvez résilier avant cette date depuis votre espace client, sans être débité."
    cta: "Gérer mon abonnement"
    signature: "À bientôt,<br>L'équipe CYNA"
  subscriptionPaymentFailed:
    subject: "Action requise : échec du paiement de votre abonnement CYNA"
    title: "Bonjour {0},"
    intro: "Le paiement du renouvellement de l'abonnement suivant a échoué :"
    desc: "Votre carte a peut-être expiré ou été refusée. Veuillez mettre à jour votre moyen de paiement depuis votre espace client pour éviter l'interruption de votre service. De nouvelles tentatives de prélèvement seront effectuées automatiquement."
    cta: "Mettre à jour mon paiement"
    signature: "À bientôt,<br>L'équipe CYNA"
  subscriptionPaymentActionRequired:
    subject: "Action requise : vérification 3-D Secure pour le renouvellement de votre abonnement CYNA"
    title: "Bonjour {0},"
    intro: "Votre banque demande une vérification supplémentaire (3-D Secure) pour finaliser le renouvellement de votre abonnement suivant :"
    desc: "Votre carte est valide — aucune mise à jour n'est nécessaire. Cliquez sur le bouton ci-dessous pour valider la transaction sur la page sécurisée de Stripe. Sans confirmation, votre abonnement sera suspendu après quelques nouvelles tentatives."
    cta: "Confirmer le paiement"
    note: "Lien sécurisé hébergé par Stripe — valable pendant la période de renouvellement."
    signature: "À bientôt,<br>L'équipe CYNA"
  subscriptionCancelled:
    subject: "Confirmation d'annulation de votre abonnement CYNA"
    title: "Bonjour {0},"
    intro: "Nous confirmons l'annulation de l'abonnement suivant :"
    desc: "Vous conservez l'accès à votre service jusqu'à la fin de la période déjà réglée. Aucun nouveau prélèvement ne sera effectué. Vous pouvez réactiver un abonnement à tout moment depuis votre espace client."
    cta: "Accéder à mon espace client"
    signature: "À bientôt,<br>L'équipe CYNA"
  emailChange:
    subject: "Confirmez votre nouvelle adresse e-mail – CYNA"
    title: "Bonjour {0},"
    intro: "Nous avons reçu une demande de modification de l'adresse e-mail associée à votre compte CYNA."
    desc: "Cliquez sur le bouton ci-dessous pour confirmer votre nouvelle adresse. Ce lien est valable 24 heures."
    cta: "Confirmer ma nouvelle adresse e-mail"
    expiry: "Si vous n'êtes pas à l'origine de cette demande, ignorez simplement cet e-mail."
    signature: "À très bientôt,<br>L'équipe CYNA"
  passwordChanged:
    subject: "Votre mot de passe CYNA a été modifié"
    title: "Bonjour {0},"
    intro: "Le mot de passe associé à votre compte CYNA vient d'être modifié."
    desc: "Pour votre sécurité, toutes vos sessions actives ont été déconnectées. Vous devrez vous reconnecter sur vos autres appareils."
    security: "Si vous n'êtes pas à l'origine de ce changement, votre compte est probablement compromis. Réinitialisez immédiatement votre mot de passe et contactez notre support."
    cta: "Accéder à mon compte"
    signature: "L'équipe sécurité CYNA"
  emailChanged:
    subject: "Votre adresse e-mail CYNA a été modifiée"
    title: "Bonjour {0},"
    intro: "L'adresse e-mail associée à votre compte CYNA a été modifiée."
