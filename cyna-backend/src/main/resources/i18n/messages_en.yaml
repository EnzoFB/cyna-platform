email:
  welcome:
    subject: "Welcome to CYNA!"
    title: "Hello {0},"
    intro: "We're excited to have you on board at CYNA!"
    desc: "Protect your business with advanced cybersecurity SaaS solutions: SOC, EDR, XDR."
    cta: "Get started on your platform now."
    signature: "See you soon,<br>The CYNA Team"
  otp:
    subject: "Your CYNA login code"
    title: "Your verification code"
    intro: "Use the code below to complete your login to the CYNA platform."
    expiry: "This code expires at {0}. Do not share it with anyone."
    security: "If you did not request this, please ignore this email and secure your account immediately."
    signature: "See you soon,<br>The CYNA Team"
  emailChange:
    subject: "Confirm your new email address - CYNA"
    title: "Hello {0},"
    intro: "We received a request to change the email address associated with your CYNA account."
    desc: "Click the button below to confirm your new email address. This link is valid for 24 hours."
    cta: "Confirm my new email address"
    expiry: "If you did not request this change, you can safely ignore this email."
    signature: "See you soon,<br>The CYNA Team"
  subscriptionAutoRenewReminder:
    subject: "Your CYNA subscription automatic renewal"
    title: "Hello {0},"
    intro: "We are informing you that your subscription will renew automatically in 2 months."
    desc: "If you do not want this automatic renewal, you can disable it from your customer account."
    cta: "Manage my subscription"
    signature: "See you soon,<br>The CYNA Team"
  passwordChanged:
    subject: "Your CYNA password was changed"
    title: "Hello {0},"
    intro: "The password associated with your CYNA account was just changed."
    desc: "For your security, all your active sessions have been signed out. You will need to log in again on your other devices."
    security: "If you did not make this change, your account may be compromised. Reset your password immediately and contact our support."
    cta: "Access my account"
    signature: "The CYNA security team"
  emailChanged:
    subject: "Your CYNA email address was changed"
    title: "Hello {0},"
    intro: "The email address associated with your CYNA account was just changed."
    desc: "Your new sign-in address is: {1}"
    security: "If you did not make this change, your account may be compromised. Contact our support immediately to recover access."
    signature: "The CYNA security team"
  suspiciousActivity:
    subject: "Suspicious activity detected on your CYNA account"
    title: "Hello {0},"
    intro: "We detected suspicious activity on your CYNA account and took action to protect it."
    desc: "All your active sessions have been revoked as a precaution. You will need to log in again."
    security: "If you do not recognise this activity, change your password immediately and contact our support."
    cta: "Reset my password"
    signature: "The CYNA security team"
  passwordReset:
    subject: "Reset your CYNA password"
    title: "Hello {0},"
    intro: "We received a request to reset the password for your CYNA account."
    desc: "Click the button below to choose a new password. This link is single-use and expires in 1 hour."
    cta: "Reset my password"
    security: "If you did not request this, you can safely ignore this email — your current password is still valid."
    signature: "The CYNA security team"
