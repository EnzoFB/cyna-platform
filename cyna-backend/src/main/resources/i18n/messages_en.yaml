email:
  welcome:
    subject: "Welcome to CYNA!"
    title: "Hello {0},"
    intro: "We're excited to have you on board at CYNA!"
    desc: "Protect your business with advanced cybersecurity SaaS solutions: SOC, EDR, XDR."
    cta: "Get started on your platform now."
    signature: "See you soon,<br>The CYNA Team"
  verification:
    subject: "Confirm your CYNA email address"
    title: "Hello {0},"
    intro: "Thanks for signing up to CYNA! Just one more step to activate your account."
    desc: "Click the button below to confirm your email address. This link is single-use and expires in 24 hours."
    cta: "Confirm my email address"
    security: "If you did not create this account, you can safely ignore this email — no account will be activated."
    signature: "See you soon,<br>The CYNA Team"
  otp:
    subject: "Your CYNA login code"
    title: "Your verification code"
    intro: "Use the code below to complete your login to the CYNA platform."
    expiry: "This code expires at {0}. Do not share it with anyone."
    security: "If you did not request this, please ignore this email and secure your account immediately."
    signature: "See you soon,<br>The CYNA Team"
  emailChange:
    subject: "Confirm your new email address - CYNA"
    title: "Hello {0},"
    intro: "We received a request to change the email address associated with your CYNA account."
    desc: "Click the button below to confirm your new email address. This link is valid for 24 hours."
    cta: "Confirm my new email address"
    expiry: "If you did not request this change, you can safely ignore this email."
    signature: "See you soon,<br>The CYNA Team"
  subscriptionAutoRenewReminder:
    subject: "Your CYNA subscription automatic renewal"
    title: "Hello {0},"
    intro: "We are informing you that your subscription will renew automatically in 2 months."
    desc: "If you do not want this automatic renewal, you can disable it from your customer account."
    cta: "Manage my subscription"
    signature: "See you soon,<br>The CYNA Team"
  subscriptionPaymentActionRequired:
    subject: "Action required: complete the 3-D Secure check for your CYNA subscription renewal"
    title: "Hello {0},"
    intro: "Your bank requires an additional verification (3-D Secure) to complete the renewal of the following subscription:"
    desc: "Your card is valid — no update is required. Click the button below to complete the verification on Stripe's secure page. Without confirmation, your subscription will be suspended after a few retry attempts."
    cta: "Confirm payment"
    note: "Secure link hosted by Stripe — valid for the renewal window."
    signature: "Until next time,<br>The CYNA Team"
  subscriptionPaymentFailed:
    subject: "Action required: your CYNA subscription payment failed"
    title: "Hello {0},"
    intro: "The renewal payment for the following subscription failed:"
    desc: "Your card may have expired or been declined. Please update your payment method from your customer account to avoid any service interruption. Payment will be retried automatically."
    cta: "Update my payment"
    signature: "See you soon,<br>The CYNA Team"
  subscriptionCancelled:
    subject: "Your CYNA subscription has been cancelled"
    title: "Hello {0},"
    intro: "We confirm the cancellation of the following subscription:"
    desc: "You keep access to your service until the end of the period you already paid for. No further charge will be made. You can re-subscribe at any time from your customer account."
    cta: "Go to my account"
    signature: "See you soon,<br>The CYNA Team"
  passwordChanged:
    subject: "Your CYNA password was changed"
    title: "Hello {0},"
    intro: "The password associated with your CYNA account was just changed."
    desc: "For your security, all your active sessions have been signed out. You will need to log in again on your other devices."
    security: "If you did not make this change, your account may be compromised. Reset your password immediately and contact our support."
    cta: "Access my account"
    signature: "The CYNA security team"
  emailChanged:
    subject: "Your CYNA email address was changed"
    title: "Hello {0},"
    intro: "The email address associated with your CYNA account was just changed."
    desc: "Your new sign-in address is: {1}"
    security: "If you did not make this change, your account may be compromised. Contact our support immediately to recover access."
    signature: "The CYNA security team"
  suspiciousActivity:
    subject: "Suspicious activity detected on your CYNA account"
    title: "Hello {0},"
    intro: "We detected suspicious activity on your CYNA account and took action to protect it."
    desc: "All your active sessions have been revoked as a precaution. You will need to log in again."
    security: "If you do not recognise this activity, change your password immediately and contact our support."
    cta: "Reset my password"
    signature: "The CYNA security team"
  passwordReset:
    subject: "Reset your CYNA password"
    title: "Hello {0},"
    intro: "We received a request to reset the password for your CYNA account."
    desc: "Click the button below to choose a new password. This link is single-use and expires in 1 hour."
    cta: "Reset my password"
    security: "If you did not request this, you can safely ignore this email — your current password is still valid."
    signature: "The CYNA security team"
  contact:
    subject: "[Contact CYNA] {0}"
    title: "New contact message"
    from: "From:"
    subjectLabel: "Subject:"
    messageLabel: "Message:"
    signature: "This email was sent from the CYNA website contact form.<br>The CYNA Team"
  contactAcknowledgement:
    subject: "We have received your message"
    title: "Thank you for contacting us"
    greeting: "Hello"
    body: "We have received your message and our team will process it as soon as possible."
    subjectLabel: "Your subject:"
    responseTime: "We usually respond within 48 business hours."
    signature: "The CYNA Team"
  orderConfirmation:
    subject: "Your CYNA order confirmation {0}"
    title: "Hello {0},"
    intro: "Thank you for your order! Your payment has been received and your subscriptions are now active."
    reference: "Reference:"
    placedAt: "Placed on:"
    col:
      product: "Product"
      billingCycle: "Billing"
      quantity: "Qty"
      unitPrice: "Unit price"
      total: "Total"
    billingCycle:
      monthly: "Monthly"
      yearly: "Yearly"
    subtotalHt: "Total (excl. VAT)"
    vat: "VAT"
    totalTtc: "Total (incl. VAT)"
    vatReverseCharge: "B2B reverse charge: VAT at 0%, payable by the customer."
    vatNotice: "The VAT and total (incl. VAT) actually billed by Stripe are detailed on the Stripe invoice you receive separately (VAT computed from your billing address, B2B reverse charge where applicable)."
    access: "You can review your order details and manage your subscriptions from your account."
    cta: "View my orders"
    signature: "See you soon,<br>The CYNA Team"
