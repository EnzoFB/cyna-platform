<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:20px;">
  <tr>
    <td align="center">

      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:30px;">

        <!-- HEADER -->
        <tr>
          <td align="center" style="font-size:24px;font-weight:bold;color:#1a1a1a;">
            CYNA
          </td>
        </tr>

        <!-- TITLE -->
        <tr>
          <td style="padding-top:20px;font-size:20px;color:#1a1a1a;">
            <span th:text="#{email.otp.title}"></span>
          </td>
        </tr>

        <!-- INTRO -->
        <tr>
          <td style="padding-top:15px;color:#555;">
            <span th:text="#{email.otp.intro}"></span>
          </td>
        </tr>

        <!-- OTP CODE -->
        <tr>
          <td align="center" style="padding:30px 0 10px;">
            <div style="display:inline-block;background:#f0f9ff;border:2px solid #00D9FF;border-radius:8px;padding:16px 40px;">
              <span th:text="${otpCode}"
                    style="font-size:36px;font-weight:bold;letter-spacing:12px;color:#1a1a1a;font-family:monospace;">
              </span>
            </div>
          </td>
        </tr>

        <!-- EXPIRY -->
        <tr>
          <td align="center" style="padding-bottom:20px;font-size:13px;color:#888;">
            <span th:text="#{email.otp.expiry(${expiresAt})}"></span>
          </td>
        </tr>

        <!-- SECURITY NOTE -->
        <tr>
          <td style="padding-top:10px;font-size:13px;color:#999;border-top:1px solid #eee;padding-top:16px;">
            <span th:text="#{email.otp.security}"></span>
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="padding-top:20px;font-size:14px;color:#999;">
            <span th:utext="#{email.otp.signature}"></span>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
