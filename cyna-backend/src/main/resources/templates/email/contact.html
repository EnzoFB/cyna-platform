<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:20px;">
  <tr>
    <td align="center">

      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:30px;">

        <!-- HEADER -->
        <tr>
          <td align="center" style="font-size:24px;font-weight:bold;color:#1a1a1a;">
            CYNA
          </td>
        </tr>

        <!-- TITLE -->
        <tr>
          <td style="padding-top:20px;font-size:20px;color:#1a1a1a;">
            <span th:text="#{email.contact.title}"></span>
          </td>
        </tr>

        <!-- FROM -->
        <tr>
          <td style="padding-top:15px;color:#555;">
            <strong th:text="#{email.contact.from}"></strong>
            <span th:text="${name}"></span> (<span th:text="${fromEmail}"></span>)
          </td>
        </tr>

        <!-- SUBJECT -->
        <tr>
          <td style="padding-top:10px;color:#555;">
            <strong th:text="#{email.contact.subjectLabel}"></strong>
            <span th:text="${subject}"></span>
          </td>
        </tr>

        <!-- MESSAGE -->
        <tr>
          <td style="padding-top:10px;color:#555;">
            <strong th:text="#{email.contact.messageLabel}"></strong>
          </td>
        </tr>
        <tr>
          <td style="padding:10px;background:#f9f9f9;border-radius:4px;color:#333;">
            <span th:text="${message}" style="white-space:pre-wrap;"></span>
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="padding-top:20px;font-size:14px;color:#999;">
            <span th:utext="#{email.contact.signature}"></span>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
