<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:20px;">
  <tr>
    <td align="center">

      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:30px;">

        <!-- HEADER -->
        <tr>
          <td align="center" style="font-size:24px;font-weight:bold;color:#1a1a1a;">
            CYNA
          </td>
        </tr>

        <!-- TITLE -->
        <tr>
          <td style="padding-top:20px;font-size:20px;color:#1a1a1a;">
            <span th:text="#{email.contactAcknowledgement.title}"></span>
          </td>
        </tr>

        <!-- GREETING -->
        <tr>
          <td style="padding-top:15px;color:#555;">
            <span th:text="#{email.contactAcknowledgement.greeting}"></span> <strong th:text="${name}"></strong>,
          </td>
        </tr>

        <!-- BODY -->
        <tr>
          <td style="padding-top:10px;color:#555;line-height:1.6;">
            <span th:text="#{email.contactAcknowledgement.body}"></span>
          </td>
        </tr>

        <!-- SUBJECT -->
        <tr>
          <td style="padding-top:15px;color:#555;">
            <strong th:text="#{email.contactAcknowledgement.subjectLabel}"></strong>
            <span th:text="${subject}"></span>
          </td>
        </tr>

        <!-- RESPONSE TIME -->
        <tr>
          <td style="padding-top:10px;color:#555;line-height:1.6;">
            <span th:text="#{email.contactAcknowledgement.responseTime}"></span>
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="padding-top:20px;font-size:14px;color:#999;">
            <span th:utext="#{email.contactAcknowledgement.signature}"></span>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
