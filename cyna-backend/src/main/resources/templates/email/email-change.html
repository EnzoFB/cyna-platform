<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:20px;">
  <tr>
    <td align="center">

      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:30px;">

        <!-- HEADER -->
        <tr>
          <td align="center" style="font-size:24px;font-weight:bold;color:#1a1a1a;">
            CYNA
          </td>
        </tr>

        <!-- TITLE -->
        <tr>
          <td style="padding-top:20px;font-size:20px;color:#1a1a1a;">
            <span th:text="#{email.emailChange.title(${firstName})}"></span>
          </td>
        </tr>

        <!-- TEXT -->
        <tr>
          <td style="padding-top:15px;color:#555;">
            <span th:text="#{email.emailChange.intro}"></span>
          </td>
        </tr>

        <tr>
          <td style="padding-top:10px;color:#555;">
            <span th:text="#{email.emailChange.desc}"></span>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding:25px 0;">
            <a th:href="${confirmUrl}"
               style="background:#00D9FF;color:black;padding:12px 20px;text-decoration:none;border-radius:5px;font-weight:bold;">
              <span th:text="#{email.emailChange.cta}"></span>
            </a>
          </td>
        </tr>

        <!-- EXPIRY NOTE -->
        <tr>
          <td style="font-size:13px;color:#999;padding-bottom:15px;">
            <span th:text="#{email.emailChange.expiry}"></span>
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="font-size:14px;color:#999;">
            <span th:utext="#{email.emailChange.signature}"></span>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
