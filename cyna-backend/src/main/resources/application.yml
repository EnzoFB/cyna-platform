spring:
  application:
    name: cyna-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cyna}
    username: ${DB_USERNAME:cyna}
    password: ${DB_PASSWORD:cyna_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - user_schema
      - product_schema
      - cart_schema
      - order_schema
      - subscription_schema
      - payment_schema

server:
  port: ${SERVER_PORT:8080}

app:
  subscription:
    auto-renew-reminder:
      cron: ${APP_SUBSCRIPTION_AUTO_RENEW_REMINDER_CRON:0 0 8 * * *}
  security:
    require-https: false
    hsts:
      enabled: false
      max-age-seconds: 31536000
      include-subdomains: true
      preload: true
    content-security-policy: "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
    referrer-policy: "no-referrer"
    permissions-policy: "geolocation=(), microphone=(), camera=()"
    csrf:
      enabled: false
      ignored-paths:
        - /api/v1/auth/**
        - /swagger-ui/**
        - /v3/api-docs/**
        - /actuator/**
    rate-limit:
      enabled: true
      window-seconds: 60
      public-requests-per-minute: 60
      authenticated-requests-per-minute: 300
      admin-requests-per-minute: 600
      auth-requests-per-minute: 20

jwt:
  secret: ${JWT_SECRET:cyna-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-expiration-hours: ${JWT_ACCESS_EXPIRATION_HOURS:1}
  refresh-expiration-hours: ${JWT_REFRESH_EXPIRATION_HOURS:24}

otp:
  login:
    code-length: ${OTP_LOGIN_CODE_LENGTH:6}
    expiration-minutes: ${OTP_LOGIN_EXPIRATION_MINUTES:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

