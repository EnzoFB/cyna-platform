spring:
  application:
    name: cyna-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cyna}
    username: ${DB_USERNAME:cyna}
    password: ${DB_PASSWORD:cyna_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - user_schema
      - product_schema
      - cart_schema
      - order_schema
      - payment_schema

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:cyna-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-expiration-hours: ${JWT_ACCESS_EXPIRATION_HOURS:1}
  refresh-expiration-hours: ${JWT_REFRESH_EXPIRATION_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
