# Production profile (activate with SPRING_PROFILES_ACTIVE=prod).
# Overrides only the security defaults that must be hardened in prod;
# every other key is inherited from application.yml.

server:
  # The app runs behind a TLS-terminating reverse proxy. Honour
  # X-Forwarded-Proto/Host so Spring sees the request as HTTPS — required
  # for requiresSecure() to work without an http->https redirect loop, and
  # for correctly-scoped Secure cookies.
  forward-headers-strategy: framework

app:
  security:
    # Enforce HTTPS: redirect any plaintext request and mark auth cookies
    # (refresh, device_token) Secure.
    require-https: true
    hsts:
      # Tell browsers to only ever reach this origin over HTTPS.
      # max-age / include-subdomains / preload inherited from application.yml.
      enabled: true

# Cross-origin requests: pin the exact production front-end origin(s).
# REQUIRED in prod — no localhost fallback. Comma-separated, scheme + host
# (+ port if non-standard), NO trailing slash. The app fails to start if
# CORS_ALLOWED_ORIGINS is unset, so a misconfigured deploy can't silently
# accept localhost. Example: https://app.cyna.com,https://admin.cyna.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

otp:
  # HMAC pepper for login OTPs. REQUIRED in prod — drop the dev default so a
  # forgotten env var fails fast at startup instead of shipping a publicly
  # known pepper (same posture as JWT_SECRET). Must be >=16 bytes.
  hash-pepper: ${OTP_HASH_PEPPER}

logging:
  level:
    # Quiet the SQL/web debug chatter in prod; keep app logs at INFO.
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
