name: CI – Build Check

on:
  pull_request:
    branches: [develop, master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Migrations – fast static check (no DB required)
  # Catches duplicate V{n} versions and naming violations
  # before they ever reach a runtime environment.
  # ──────────────────────────────────────────────
  check-migrations:
    name: Check Flyway Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration files
        run: bash cyna-backend/scripts/check-flyway-migrations.sh

  # ──────────────────────────────────────────────
  # Backend – Spring Boot / Gradle / Java 21
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: check-migrations
    defaults:
      run:
        working-directory: cyna-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

  # ──────────────────────────────────────────────
  # Backend boot smoke test – runs all migrations
  # against a fresh Postgres 16 and verifies the
  # app starts cleanly. Catches Flyway collisions,
  # checksum drift, ddl-auto:validate mismatches,
  # and broken FK constraints.
  # ──────────────────────────────────────────────
  boot-backend:
    name: Boot Backend Smoke Test
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: cyna-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyna
          POSTGRES_USER: cyna
          POSTGRES_PASSWORD: cyna_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Required env vars (no defaults in app config)
      STRIPE_SECRET_KEY: sk_test_dummy_for_boot_smoke_test
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy_for_boot_smoke_test
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_boot_smoke_test
      JWT_SECRET: dev-only-jwt-secret-for-ci-smoke-test-do-not-use-in-prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cyna
      SPRING_DATASOURCE_USERNAME: cyna
      SPRING_DATASOURCE_PASSWORD: cyna_dev_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # We deliberately DO NOT run `./gradlew flywayMigrate` here.
      # The gradle plugin pulls Flyway 10.22 while Spring Boot ships
      # Flyway 10.20; the two versions produce different checksums for
      # the same SQL, so applying via the plugin first would make the
      # subsequent Spring Boot validation fail with checksum mismatch.
      # Letting Spring Boot run the migrations on startup is enough —
      # any Flyway error (collision, syntax, FK, etc.) surfaces as a
      # boot failure, which is exactly what this smoke test checks.
      - name: Boot Spring Boot and check /actuator/health
        run: |
          chmod +x ./gradlew
          ./gradlew bootRun > boot.log 2>&1 &
          BOOT_PID=$!
          # Wait up to 120 seconds for the app to come up
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "App booted successfully."
              # Kill the gradle process tree so the runner step exits cleanly.
              pkill -P $BOOT_PID 2>/dev/null || true
              kill $BOOT_PID 2>/dev/null || true
              exit 0
            fi
            # Detect early Spring/Flyway failures so we don't sit through
            # the full 120s timeout when the cause is already in the log.
            if grep -q "APPLICATION FAILED TO START\|FlywayValidateException\|FlywayException" boot.log 2>/dev/null; then
              echo "App failed early — see log below." >&2
              tail -100 boot.log >&2
              pkill -P $BOOT_PID 2>/dev/null || true
              kill $BOOT_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "App failed to boot within 120 seconds." >&2
          tail -100 boot.log >&2
          pkill -P $BOOT_PID 2>/dev/null || true
          kill $BOOT_PID 2>/dev/null || true
          exit 1

  # ──────────────────────────────────────────────
  # Frontend – Angular (PWA + Backoffice)
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyna-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyna-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI Kit
        run: npm run build:ui-kit

      - name: Build PWA
        run: npm run build:pwa

      - name: Build Backoffice
        run: npm run build:backoffice
