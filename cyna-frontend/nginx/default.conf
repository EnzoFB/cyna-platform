# Reverse proxy + SPA host for the Cyna frontends.
#
#   :80  -> Customer PWA   (e.g. https://app.cyna.com)
#   :81  -> Backoffice     (e.g. https://admin.cyna.com)
#
# Each server block serves its Angular SPA (HTML5 routing fallback) and
# forwards /api/v1/* to the backend container. TLS is expected to be
# terminated by an upstream load balancer / ingress that sets
# X-Forwarded-Proto=https (the backend's prod profile reads it).
#
# The backend host is resolved at request time via Docker's embedded DNS
# (127.0.0.11) using a variable in proxy_pass. This lets nginx start even if
# the backend isn't up yet, and survive backend restarts — a static
# `upstream backend:8080` would make nginx refuse to start ("host not found").

# Long-cache hashed assets, never cache index.html (so new deploys are picked up).
map $uri $cache_control {
    default                 "no-cache";
    ~*\.(js|css|woff2?|png|jpe?g|svg|gif|ico|webp|map)$ "public, max-age=31536000, immutable";
}

# Protocol seen by the end user. The upstream TLS terminator sets
# X-Forwarded-Proto; honour it, and default to https since this stack is
# always fronted by TLS termination. The backend's prod profile reads this to
# avoid an http->https redirect loop and to scope Secure cookies correctly.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# ---- Customer PWA -------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/pwa;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { return 200 "ok\n"; access_log off; }

    location /api/v1/ {
        set $backend "backend:8080";
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control $cache_control;
        try_files $uri $uri/ /index.html;
    }
}

# ---- Backoffice ---------------------------------------------------------
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html/backoffice;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { return 200 "ok\n"; access_log off; }

    location /api/v1/ {
        set $backend "backend:8080";
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control $cache_control;
        try_files $uri $uri/ /index.html;
    }
}
