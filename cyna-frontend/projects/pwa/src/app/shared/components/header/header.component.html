<header class="app-header">
  <div class="header-top">
    <a class="logo" [routerLink]="'/home'" aria-label="CYNA - Accueil">
      <img ngSrc="logo.png" alt="CYNA Logo" height="40" width="151" priority>
    </a>

    <app-search-bar />

    <div class="header-actions">
      <a class="cart" [routerLink]="'/cart'" aria-label="Panier">
        <img ngSrc="icons/cart.svg" alt="" height="20" width="20" aria-hidden="true">
        <span>{{ 'header.cart' | translate }} ({{ cartItemsCount() }})</span>
      </a>

      <button class="lang-btn" type="button" (click)="changeLang()" [attr.aria-label]="'header.language' | translate">
        <img [ngSrc]="'flags/' + currentLang + '.svg'"
             [alt]="currentLang" height="16" width="24" class="flag-icon">
      </button>

      <button
        #burgerButton
        class="burger"
        type="button"
        [attr.aria-expanded]="menuOpen"
        aria-controls="user-menu-panel"
        [attr.aria-label]="'header.menu.toggle' | translate"
        (click)="toggleMenu()">
        <img ngSrc="icons/burger.svg" alt="" height="20" width="20" aria-hidden="true">
      </button>
    </div>
  </div>

  @if (menuOpen) {
    <app-user-menu id="user-menu-panel" (close)="closeMenu()" />
  }

  <nav class="header-bottom" aria-label="Navigation principale" (keydown.escape)="onMenuEscape()">
    <ul class="header-nav-list">
      <li class="header-nav-item">
        <a
          class="header-nav-link"
          [routerLink]="'/home'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          {{ 'header.homepage' | translate }}
        </a>
      </li>
      <li class="header-nav-item">
        <a
          class="header-nav-link"
          [routerLink]="'/offers'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          {{ 'header.offers' | translate }}
        </a>
      </li>
      <li class="header-nav-item">
        <a
          class="header-nav-link"
          [routerLink]="'/catalog'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          {{ 'header.catalog' | translate }}
        </a>
      </li>
    </ul>
  </nav>
</header>
