<header class="app-header">
  <div class="header-top">
    <div class="logo">
      <img ngSrc="logo.png" alt="CYNA Logo" height="40" width="151" priority>
    </div>

    <div class="search-bar">
      <input type="text" [placeholder]="'header.searchbar' | translate">
      <span class="icon-search">
        <img ngSrc="icons/search.svg" alt="Rechercher" height="26" width="26">
      </span>
    </div>

    <div class="header-actions">
      <a class="cart" [routerLink]="'/cart'">
        <img ngSrc="icons/cart.svg" alt="Panier" height="20" width="20">
        <span>{{ 'header.cart' | translate }} ({{ cartItemsCount() }})</span>
      </a>

      <button class="lang-btn" (click)="changeLang()">
        <img [ngSrc]="'flags/' + currentLang + '.svg'"
             [alt]="currentLang" height="16" width="24" class="flag-icon">
      </button>

      <button class="burger" (click)="toggleMenu()">
        <img ngSrc="icons/burger.svg" alt="Menu" height="20" width="20">
      </button>
    </div>
    @if (menuOpen) {
      <app-user-menu (close)="closeMenu()"/>
    }
  </div>

  <nav class="header-bottom">
    <a [routerLink]="'/home'" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" >{{ 'header.homepage' | translate }}</a>
    <span class="dot">•</span>
    <a [routerLink]="'/offers'" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" >{{ 'header.offers' | translate }}</a>
    <span class="dot">•</span>
    <a [routerLink]="'/catalog'" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" >{{ 'header.catalog' | translate }}</a>
  </nav>
</header>
