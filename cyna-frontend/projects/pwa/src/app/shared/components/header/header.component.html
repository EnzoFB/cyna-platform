<header class="app-header">
  <div class="header-top">
    <div class="logo">
      <img ngSrc="logo.png" alt="CYNA Logo" height="40" width="151" priority>
    </div>

    <div class="search-bar">
      <input type="text" [placeholder]="'header.searchbar' | translate">
      <span class="icon-search">
        <img ngSrc="icons/search.svg" alt="Rechercher" height="26" width="26">
      </span>
    </div>

    <div class="header-actions">
      <div class="cart">
        <img ngSrc="icons/cart.svg" alt="Panier" height="20" width="20">
        <span>{{ 'header.cart' | translate }}(0)</span>
<!--        TODO afficher nombre réel de produit dans le panier-->
      </div>

      <button class="lang-btn" (click)="changeLang()">
        <img [ngSrc]="'flags/' + currentLang + '.svg'"
             [alt]="currentLang" height="24" width="24" class="flag-icon">
      </button>

      <button class="burger" (click)="toggleMenu()">
        <img ngSrc="icons/burger.svg" alt="Menu" height="20" width="20">
      </button>
    </div>
    @if (menuOpen) {
      <app-user-menu (close)="closeMenu()"/>
    }
  </div>

  <nav class="header-bottom">
    <a [routerLink]="'/home'" [class.active]="isActive('/home')" (click)="navigate($event, '/home')" >{{ 'header.homepage' | translate }}</a>
    <span class="dot">•</span>
    <a [routerLink]="'/offers'" [class.active]="isActive('/offers')" (click)="navigate($event, '/offers')">{{ 'header.offers' | translate }}</a>
    <span class="dot">•</span>
    <a [routerLink]="'/catalog'" [class.active]="isActive('/catalog')" (click)="navigate($event, '/catalog')">{{ 'header.catalog' | translate }}</a>
  </nav>
</header>
