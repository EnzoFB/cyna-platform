<div class="account-page">
  <div class="account-container">

    <div class="account-header">
      <h1>{{ 'account.title' | translate }}</h1>
      <p class="account-welcome">
        {{ 'account.welcome' | translate }}
        <strong>{{ displayName() }}</strong>
      </p>
    </div>

    <!-- TODO Dashboard -->

    <div class="account-tabs" role="tablist">
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === 'subscriptions'"
        [class.active]="activeTab() === 'subscriptions'"
        (click)="setTab('subscriptions')"
      >
        {{ 'account.tabs.subscriptions' | translate }}
      </button>
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === 'history'"
        [class.active]="activeTab() === 'history'"
        (click)="setTab('history')"
      >
        {{ 'account.tabs.history' | translate }}
      </button>
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === 'profile'"
        [class.active]="activeTab() === 'profile'"
        (click)="setTab('profile')"
      >
        {{ 'account.tabs.profile' | translate }}
      </button>
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === 'addresses'"
        [class.active]="activeTab() === 'addresses'"
        (click)="setTab('addresses')"
      >
        {{ 'account.tabs.addresses' | translate }}
      </button>
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === 'payment'"
        [class.active]="activeTab() === 'payment'"
        (click)="setTab('payment')"
      >
        {{ 'account.tabs.payment' | translate }}
      </button>
    </div>

    <div class="account-content" role="tabpanel">
      @if (activeTab() === 'subscriptions') {
        <app-subscriptions />
      }
      @if (activeTab() === 'history') {
        <app-history />
      }
      @if (activeTab() === 'profile') {
        <app-profile [profile]="profile()" (profileUpdated)="loadProfile()" />
      }
      @if (activeTab() === 'addresses') {
        <app-addresses />
      }
      @if (activeTab() === 'payment') {
        <app-payment-methods />
      }
    </div>

  </div>
</div>
