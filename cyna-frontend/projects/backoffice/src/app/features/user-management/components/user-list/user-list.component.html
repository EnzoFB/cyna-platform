<div class="user-list">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar__search">
      <input
        type="text"
        placeholder="Search for id, name Customer"
        [value]="searchQuery()"
        (input)="onSearchChange($any($event.target).value)"
      />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </div>

    <div class="toolbar__actions">
      <button class="btn-primary" (click)="openCreateModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span>Nouveau</span>
      </button>
      <button class="btn-outline" (click)="exportCsv()">
        <span>Export</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Toast -->
  @if (copyToast()) {
    <div class="copy-toast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span>{{ copyToast() }}</span>
    </div>
  }

  <!-- AG Grid -->
  <div class="grid-wrapper" (click)="onGridClick($event)">
    @if (loading()) {
      <div class="grid-loading">
        <div class="spinner"></div>
        <span>Chargement des utilisateurs...</span>
      </div>
    }
    <ag-grid-angular
      class="user-grid"
      [theme]="theme"
      [rowData]="rowData()"
      [columnDefs]="colDefs"
      [defaultColDef]="defaultColDef"
      [rowSelection]="'multiple'"
      [suppressRowClickSelection]="true"
      [animateRows]="true"
      [domLayout]="'autoHeight'"
      (gridReady)="onGridReady($event)"
    />
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <span class="pagination__info">
      {{ rangeLabel() }}
    </span>

    <div class="pagination__controls">
      <div class="pagination__page-select">
        <span>The page on</span>
        <select
          [value]="currentPage() + 1"
          (change)="goToPage(+$any($event.target).value - 1)"
        >
          @for (p of pagesArray(); track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
      </div>

      <button
        class="pagination__btn"
        (click)="previousPage()"
        [disabled]="currentPage() === 0"
        title="Page précédente"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <button
        class="pagination__btn"
        (click)="nextPage()"
        [disabled]="currentPage() >= totalPages() - 1"
        title="Page suivante"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Action toast -->
@if (toast()) {
  <div class="action-toast" [class.action-toast--error]="toast()!.type === 'error'">
    @if (toast()!.type === 'success') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    }
    <span>{{ toast()!.message }}</span>
  </div>
}

<!-- User form modal -->
<app-user-form-modal
  [open]="modalOpen()"
  [user]="editingUser()"
  (closed)="closeModal()"
  (saved)="onModalSave($event)"
/>
